version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: tempmail-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=tempmail
    networks:
      - tempmail-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tempmail-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - tempmail-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tempmail-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "2525:2525"
    environment:
      - API_PORT=8080
      - SMTP_HOST=0.0.0.0
      - SMTP_PORT=2525
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=tempmail
      - REDIS_URL=redis://redis:6379
      - EMAIL_DOMAIN=your-tempmail.info
      - EMAIL_EXPIRY_MINUTES=60
      - ENCRYPTION_KEY=change-this-to-secure-32-byte-key-in-production-now
      - JWT_SECRET=change-this-jwt-secret-in-production
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_WINDOW=60
      - FRONTEND_URL=http://localhost:3000
      - ENVIRONMENT=development
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tempmail-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tempmail-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
      - NEXT_PUBLIC_EMAIL_DOMAIN=your-tempmail.info
    depends_on:
      - backend
    networks:
      - tempmail-network

networks:
  tempmail-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local

